<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AR Album Hologram</title>
    <script>
      // Cache-busting: SW register pake URL STABIL (bukan ?v=Date.now() lagi
      // — itu bikin browser nganggep tiap page load registrasi "SW baru",
      // ke-trigger install→activate berulang tiap load). Auto-reload
      // lewat postMessage() juga DIHAPUS (sempat dicoba 2x, dua2nya gagal:
      // versi pertama guard sessionStorage-nya nyangkut abis reload
      // pertama jadi update berikutnya diabaikan; abis guard dibuang malah
      // infinite reload loop krn kombinasi sama ?v=Date.now() di atas).
      // Cukup andalin: (1) filename JS/CSS di-hash per build (Vite) — build
      // baru = URL baru = otomatis gak collision sama cache lama, (2)
      // sw.js fetch handler (lihat public/sw.js) fetch index.html
      // cache:'no-store' tiap navigasi begitu SW ini kecontrol — jadi
      // sekali tab di-reload/re-open, DIJAMIN dapet index.html fresh yg
      // nunjuk ke bundle JS/CSS hash terbaru. Gak ada "auto-refresh tab yg
      // dibiarin kebuka" lagi, tapi itu trade-off yg pantes drpd resiko
      // reload loop yg bikin app gak kebuka sama sekali.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => reg.update());
      }
    </script>

    <!-- Three.js dan MindAR di-import langsung oleh React (tidak perlu script tag) -->

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
    <script type="module" crossorigin src="/ar-album-hologram/assets/index-B6QgnwSk.js"></script>
    <link rel="stylesheet" crossorigin href="/ar-album-hologram/assets/index-BHEEhBLm.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
