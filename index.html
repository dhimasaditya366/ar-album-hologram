    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AR Album Hologram</title>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=' + Date.now())
          .then(reg => {
            reg.update();
            // Tab yg dibiarin kebuka lama (di-background-in, bukan di-reload
            // fresh) gak pernah ngecek update lagi krn script ini cuma jalan
            // sekali pas load awal. Tiap kali tab ini balik keliatan (user
            // switch back dari app lain), paksa cek update lagi — biar gak
            // nyangkut ke bundle lama selama-lamanya kalau tab gak pernah
            // di-close beneran.
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
          });
        // Reload otomatis begitu SW baru aktif (cache lama ter-clear).
        // DULU dibatasin sekali per session pake sessionStorage flag
        // ('sw-reloaded') buat nyegah infinite-reload-loop — tapi flag itu
        // gak pernah kereset selain lewat tombol Back di ARScene, jadi
        // begitu ke-trigger SEKALI (di deploy manapun), SEMUA deploy
        // berikutnya di session yg sama silent diabaikan (gak reload lagi)
        // walau bundle-nya udah lama basi. Root cause laporan "gak keliatan
        // berubah" yg terus berulang. Guard-nya dibuang: activate event SW
        // sendiri udah cuma nembak pas ada versi BARU beneran (dijamin sama
        // lifecycle SW-nya sendiri, gak akan loop tanpa ujung), jadi guard
        // manual di sini emang gak perlu dari awal.
        navigator.serviceWorker.addEventListener('message', function(e) {
          if (e.data === 'SW_UPDATED') window.location.reload();
        });
      }
    </script>

    <!-- Three.js dan MindAR di-import langsung oleh React (tidak perlu script tag) -->

    </style>
